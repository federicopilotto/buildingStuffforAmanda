<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do you love me</title>
<style>
    :root 
    { 
      --bg: #fff; 
      --ink: #29009b; 
      --accent: #0886c0; 
    }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    overflow: hidden; /* niente scroll: i bottoni restano sempre nello schermo */
  }
  h1 {
    font-size: clamp(2.5rem, 9vw, 6rem);
    font-weight: 400;
    font-style: italic;
    margin: 0;
    text-align: center;
  }
  .bottoni { display: flex; gap: 1.5rem; }
  button {
    font: inherit;
    font-size: 1.5rem;
    padding: 1.5rem 4rem;
    border: 2px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: left 0.25s ease, top 0.25s ease;
    
  }
  button:hover { background: #f70000; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #messaggio {
    font-size: 1.5rem;
    color: var(--accent);
    text-align: center;
    max-width: 90vw;
  }
</style>
</head>
<body>
  <h2>do you love me?</h2>
  <div id="messaggio" hidden>so you don't love me...</div>
  <div class="bottoni">
    <button>yes</button>
    <button>yes, but more</button>
  </div>

<script>
  const bottoni = document.querySelectorAll("button");
  const messaggio = document.getElementById("messaggio");

  const LIMITE = 10;           // numero di tentativi prima del pop up
  let count = 0;

  function sposta(btn) {
    // Al primo movimento il bottone passa a position: fixed,
    // lasciando un segnaposto per non far "saltare" il layout.
    if (btn.style.position !== "fixed") {
      const r = btn.getBoundingClientRect();
      const segnaposto = document.createElement("span");
      segnaposto.style.width = r.width + "px";
      segnaposto.style.height = r.height + "px";
      btn.after(segnaposto);
      btn.style.position = "fixed";
      btn.style.left = r.left + "px";
      btn.style.top = r.top + "px";
      btn.offsetWidth; // forza il reflow così parte la transizione
    }
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;
    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";
  }

  function scappa(btn) {
      sposta(btn);
      count++;
      if (count === LIMITE) popup.hidden = false;
  }

  bottoni.forEach(btn => {
    btn.addEventListener("mouseenter", () => scappa(btn));   // mouse
    btn.addEventListener("touchstart", e => {                // touch
      e.preventDefault();
      scappa(btn);
    }, { passive: false });
    btn.addEventListener("click", e => {                     // tastiera / casi limite
      e.preventDefault();
      scappa(btn);
    });
  });

  window.addEventListener("resize", () => {
    bottoni.forEach(btn => {
      if (btn.style.position === "fixed") scappa(btn);
    });
  });
</script>
</body>
</html>
